seed: 42
device: auto
data:
  source: file
  path: dataset/weather.csv
  timestamp_col: date
  feature_cols: []
  target_col: OT
  csv_encoding: latin1
  missing_sentinels:
    - -9999
  impute_method: time_interpolate
  normalize: true
  lookback: 24
  horizon: 12
  target_dim: 20
  train_ratio: 0.55
  val_ratio: 0.1
  split_mode: chronological
model:
  d_model: 128
  n_experts: 4
  latent_dim: 64
  temporal_encoder: itransformer
  nhead: 4
  num_layers: 2
  dropout: 0.1
  use_revin: true
  use_vae: true
  vae_eval_mode: mean
train:
  batch_size: 64
  lr: 0.0005
  epochs: 5
  beta_vae: 0.05
  lambda_disc: 0.05
  use_lrp: false
  lrp_method: rrp
  save_lrp: false
  pred_loss_type: mse
  pred_mae_weight: 0.0
  pred_huber_delta: 1.0
  lr_schedule:
    type: warmup_cosine
    warmup_epochs: 1
    min_lr: 0.0001
    step_size: 5
    gamma: 0.5
  weight_decay: 5.0e-05
invariant:
  enable: true
  representation_version: aligned_residual_v3_temporal_cca
  repr_dim: 64
  hidden_dim: 256
  dropout: 0.05
  epochs: 5
  lambda_forecast: 1.0
  lambda_inv_forecast: 0.3
  lambda_residual: 0.5
  lambda_orth: 0.05
  lambda_smooth: 0.1
  lambda_norm: 0.02
  lambda_hsic: 0.01
  lambda_barlow: 0.05
  lambda_temporal_ranking: 0.05
  temporal_ranking_margin: 0.01
  lambda_deployed_temporal_ranking: 0.1
  deployed_temporal_ranking_margin: 0.01
  lambda_temporal_contrastive: 0.05
  temporal_contrastive_temperature: 1.0
  lambda_vicreg_variance: 0.05
  lambda_vicreg_covariance: 0.01
  lambda_phi_vicreg_variance: 0.03
  lambda_phi_vicreg_covariance: 0.01
  vicreg_variance_target: 0.5
  use_projected_residual: true
  stop_gradient_projection_anchor: true
  zero_init_variant: true
  zero_init_variant_regressor: true
online_run:
  enable: true
stage3_v2:
  protocol_version: v3_strict_temporal_residual_cca
  write_step_metrics: true
  causal_raw_split: true
  split_safe_imputation: true
  split_safe_impute_method: causal_ffill_train_median
  counterfactual_intervention_space: generator_input
  online_batch_size: 1
  log_root: logs/load_benchmarks/stage3_v3
  checkpoint_root: checkpoints/stage3_v3
  results_root: results/stage3_v3
  run_id: manual_stage3_v3_strict
  validation_windows: 5
  generator:
    type: layer_aware_hyperlora
    checkpoint_selection:
      enabled: true
      metric: rolling_validation_served_gate
      tie_breaker: earliest_epoch
      retain_all_candidates: true
    hidden_dim: 256
    rank: 8
    max_scale: 0.5
    epochs: 10
    lr: 0.003
    lambda_delta: 0.00001
    lambda_zero: 0.01
    lambda_shift: 0.001
    lambda_improvement: 1.0
    improvement_margin: 0.0
    lambda_intervention_compare: 0.5
    intervention_margin: 0.001
    lambda_shift_budget: 0.5
    shift_budget: 0.25
    soft_reject_temperature: 0.05
    include_random_matched_norm_negative: true
  risk_gate:
    model_type: logistic
    hidden_dim: 32
    dropout: 0.0
    epochs: 120
    lr: 0.003
    calibrate_threshold: true
    threshold_grid:
      - 0.35
      - 0.5
      - 0.65
      - 0.8
  sensitivity_modes:
    - real
    - zero
    - shuffled
    - sign_flipped
    - amplified_2x
    - amplified_5x
    - random_matched_norm
  claim_gate:
    min_real_mse_gain: 0.005
    min_real_mae_gain: 0.002
    counterfactual_margin: 0.002
    max_real_reject_rate: 0.2
    rolling_min_window_pass_rate: 1.0
    require_nonzero_delta: true
    require_prediction_shift: true
online:
  stage3:
    version: v3_strict_temporal_residual_cca
    enable: true
    apply_transient: true
    allow_untrained_generator: false
    require_aligned_embeddings: true
    causal_online: true
    drift_source: delta_phi_v
    drift_polarity: 1.0
    canonicalize_delta: true
    canonicalizer_method: temporal_residual_cca_v3
    canonicalizer_ridge: 0.001
    canonicalizer_eps: 1.0e-6
    canonicalizer_scale_by_correlation: false
    calibrate_delta: true
    calibration_eps: 1.0e-6
    signal_mode: delta_vector
    normalize_vector: true
    target_modules:
      - output_head
    max_delta: 0.05
    max_pred_shift: 0.25
    blend_alpha: 0.35
    risk_gate_enable: true
    risk_gate_threshold: 0.5
    generator_checkpoint: ""
