seed: 42
device: auto
data:
  source: file
  path: dataset/weather.csv
  timestamp_col: date
  feature_cols: []
  target_col: OT
  csv_encoding: latin1
  missing_sentinels: [-9999]
  impute_method: time_interpolate
  normalize: true
  lookback: 24
  horizon: 12
  target_dim: 20
  train_ratio: 0.55
  val_ratio: 0.1
  split_mode: chronological_shifted
  online_test_ratio: 0.2
  shift_pool_ratio: 0.35
model:
  d_model: 128
  n_experts: 4
  latent_dim: 64
  temporal_encoder: crossformer
  nhead: 4
  num_layers: 2
  dropout: 0.08
  use_revin: true
  use_vae: false
train:
  batch_size: 64
  lr: 0.0004
  epochs: 3
  beta_vae: 0.0
  lambda_disc: 0.03
  use_lrp: false
  lrp_method: rrp
  save_lrp: false
  pred_loss_type: mse
  pred_mae_weight: 0.0
  pred_huber_delta: 1.0
  lr_schedule:
    type: warmup_cosine
    warmup_epochs: 1
    min_lr: 0.00008
    step_size: 5
    gamma: 0.5
  weight_decay: 0.00005
invariant:
  enable: true
  num_envs: 3
  smooth_radius: 2
  repr_dim: 64
  lambda_erm: 1.0
  lambda_var: 1.0
  epochs: 1
online_run:
  enable: true
online:
  stage1:
    lr: 0.00008
    lr_decay: 0.99
    enable: false
    update_interval: 6
    grad_clip_norm: 1.0
    rollback_on_worse: true
    max_loss_increase: 0.0
    optimizer: adagrad
    schedule: invsqrt
    bias_clip: 0.18
    alpha_kl_weight: 0.06
    bias_l2_weight: 0.0005
    min_trigger_loss: 2.5
  stability:
    gamma: 0.56
    window_size: 12
  stage2:
    enable: false
    topk_omega: 20
    topk_layer: 4
    lrp_bottleneck: 16
    ema_eta: 0.01
    ema_K: 10
    lr_scale: 0.0002
    lr_decay: 0.995
    update_interval: 12
    mask_threshold: 2.6
    min_instability_gap: 0.08
    min_drift_abs: 0.20
    gate_by_recon: false
    min_recon_error: 0.0
    with_stage1_scale: 0.02
    eval_with_stage3: true
    min_improve_abs: 0.0
    with_stage1_min_improve_abs: 0.0001
    no_stage1_lr_scale: 0.0002
    no_stage1_min_drift_abs: 0.18
    no_stage1_min_recon_error: 0.0
    no_stage1_min_improve_abs: 0.0
    no_stage1_update_interval: 8
    target_modules: [experts]
    target_modules_no_stage1: [experts]
    accept_buffer_size: 5
    warmup_steps: 48
    cooldown_steps: 80
    gain_ema_decay: 0.95
    min_gain_ema: -0.00008
    reject_cooldown_threshold: -0.0005
    min_omega_density: 0.04
    skip_if_stage3_gain_above: 0.0
    rollback_on_worse: true
    max_loss_increase: 0.0
  stage3:
    enable: true
    apply_transient: true
    lr_scale: 0.0012
    lr_decay: 0.997
    max_delta: 0.04
    min_recon_error: 0.0
    max_pred_shift: 0.22
    blend_alpha: 0.40
    blend_alpha_min: 0.30
    blend_alpha_max: 0.48
    with_stage2_blend_scale: 1.0
    with_stage1_stage2_blend_scale: 1.0
    gate_by_recon: false
    target_modules: [experts, output_head]
